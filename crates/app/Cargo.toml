[package]
name        = "pultr"
description = "Card-based terminal dashboard for your machine's settings and status"
keywords    = ["tui", "dashboard", "bluetooth", "macos", "linux"]
categories  = ["command-line-utilities"]
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
readme.workspace     = true

[[bin]]
name = "pultr"
path = "src/main.rs"

[dependencies]
pultr-cards.workspace    = true
pultr-core.workspace     = true
pultr-mock.workspace     = true
pultr-platform.workspace = true
anyhow.workspace         = true
tokio.workspace          = true

[target.'cfg(target_os = "macos")'.dependencies]
pultr-macos.workspace    = true