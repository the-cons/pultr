# Copy to ~/.config/pultr/config.toml and adjust.

[ui]
theme   = "default"
columns = 3
border  = "rounded"

# All paired devices. Enter goes inside, space toggles the selected one.
[[card]]
id   = "bluetooth"
type = "bluetooth"
keys = { power = "B", "toggle:AirPods Pro" = "a" }   # a device by name (as the card shows it) or address
# devices = ["AirPods Pro", "Magic Keyboard"]        # only these, in this order (default: all, connected first)

[[card]]
id     = "ipad"
type   = "sidecar"          # macOS only
device = "<ipad-name>"
keys   = { toggle = "i" }

[[card]]
id   = "battery"
type = "battery"

[[card]]
id   = "music"
type = "media"
span = [2, 1]
keys = { play_pause = "space", next = "n", prev = "p" }

[[card]]
id   = "out"
type = "audio-output"
keys = { cycle = "o" }

[[scene]]
id    = "desk"
title = "Desk mode"
key   = "D"
steps = ["ipad.connect", "bluetooth.connect:AirPods Pro", "music.play"]
