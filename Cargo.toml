[workspace]
resolver    = "3"
members     = ["crates/*"]

[workspace.package]
version     = "0.0.5"
edition     = "2024"
license     = "MIT OR Apache-2.0"
authors     = ["Constantin Theis <cons@ths.lu>"]
repository  = "https://github.com/the-cons/pultr"
readme      = "README.md"

[workspace.dependencies]
pultr-core  = { path = "crates/core", version = "0.0.5" }
anyhow      = "1"
async-trait = "0.1"
crossterm   = { version = "0.29.0", features = ["event-stream"]}
futures     = "0.3"
insta       = "1"
ratatui     = "0.30.2"
tokio       = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"]}
